<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For ANURADHA 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Dancing Script', cursive;
      background: linear-gradient(135deg, #800000, #a52a2a, #b22222);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255,228,235,0.95);
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 0 45px rgba(255,77,109,0.45);
      animation: heartbeat 2s infinite;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    h1 { color: #b33a5c; font-size: 2rem; margin-bottom: 10px; }
    p, .valentine, .confirmText { font-size: 1.4rem; color: #b33a5c; margin-bottom: 15px; }

    .valentine {
      font-size: 2rem;
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 1s;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .btn-row {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 20px;
    }

    button {
      font-size: 1.2rem;
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      flex: 1;
    }

    .yes { background: linear-gradient(135deg,#ff4d6d,#ff758f); color:white; }
    .no { background:#eee; }

    .finalMessage {
      display:none;
      font-size:2rem;
      font-weight:bold;
      color:#b33a5c;
    }

    #signature {
      position:absolute;
      bottom:15px;
      right:-220px;
      font-size:1.3rem;
      color:#b33a5c;
      white-space:nowrap;
    }

    .heart {
      position:absolute;
      font-size:18px;
      animation:floatUp 2s linear forwards;
    }

    @keyframes floatUp {
      from { transform:translateY(0); opacity:1; }
      to { transform:translateY(-60px); opacity:0; }
    }
  </style>
</head>

<body>

<div class="card">
  <h1 id="greeting">Hey ANURADHA 💖</h1>

  <p id="description">
    On this Propose Day,<br>
    my heart chose you long ago 🌹
  </p>

  <div class="valentine" id="valentineText">Will you be my Valentine? 💘</div>

  <div class="btn-row" id="firstBtnRow">
    <button class="yes" onclick="yesClick()">Yes, forever 💍</button>
    <button class="no" id="noBtn">No 🙃</button>
  </div>

  <p class="confirmText" id="confirmText" style="display:none;">
    Are you sure you wanna be my Valentine? 💌
  </p>

  <div class="btn-row" id="secondBtnRow" style="display:none;">
    <button class="yes" onclick="yesClick()">Yes, forever 💍</button>
    <button class="no" id="noBtn2">No 🙃</button>
  </div>

  <div class="finalMessage" id="finalMessage">I LOVE YOU 💖💍</div>
  <div id="signature"></div>
</div>

<script>
let yesCount = 0;
const finalMessage = document.getElementById("finalMessage");
const signature = document.getElementById("signature");

function sprinkleHearts(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💖";
  heart.style.left=Math.random()*window.innerWidth+"px";
  heart.style.top=Math.random()*window.innerHeight+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),2000);
}

function typeSignature(text){
  let i=0;
  signature.textContent="";
  signature.style.right="-220px";

  const interval=setInterval(()=>{
    signature.textContent+=text.charAt(i);
    sprinkleHearts();
    signature.style.right=(-220+(i/text.length)*240)+"px";
    i++;
    if(i===text.length){
      signature.style.right="20px";
      clearInterval(interval);
    }
  },350);
}

function yesClick(){
  yesCount++;
  if(yesCount===2){
    finalMessage.style.display="block";
    setInterval(sprinkleHearts,400);
    typeSignature("Yours, Amit"); // ✅ starts immediately
  }
}
</script>

</body>
</html>
