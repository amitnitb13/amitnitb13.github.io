<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For ANURADHA 💖</title>

  <!-- Handwritten font -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Dancing Script', cursive;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffafbd, #ffc3a0);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 2s ease;
    }

    .card {
      background: rgba(255,255,255,0.95);
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 0 45px rgba(255,77,109,0.45);
      animation: heartbeat 2s infinite;
      z-index: 2;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    h1 {
      color: #ff2e63;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .valentine {
      font-size: 1.5rem;
      color: #ff4d6d;
      margin-bottom: 25px;
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 1s; /* fade in after 1 second */
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    p {
      font-size: 1.25rem;
      margin-bottom: 25px;
      color: #444;
    }

    button {
      font-size: 1.2rem;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
    }

    .no {
      background: #eee;
      position: absolute;
    }

    .heart, .confetti {
      position: absolute;
      font-size: 24px;
      opacity: 0.9;
    }

    .letter, .finalMessage {
      display: none;
      margin-top: 15px;
      font-size: 1.3rem;
      color: #ff2e63;
    }

    .finalMessage {
      font-size: 1.8rem;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- 🎶 Soft romantic music -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_4c8c8a4f61.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Hey ANURADHA 💖</h1>
    <div class="valentine">Will you be my Valentine? 💘</div>

    <p>
      On this Propose Day,<br>
      I just want you to know…<br>
      my heart chose you long ago 🌹
    </p>

    <button class="yes" onclick="yesClick()">Yes, forever 💍</button>
    <button class="no" id="noBtn">No 🙃</button>

    <div class="letter" id="loveLetter">
      You are my favorite thought, my happiest smile,<br>
      and my most beautiful dream 💕<br><br>
      I promise to stand by you,<br>
      laugh with you, and love you — always 😘💖
    </div>

    <div class="finalMessage" id="finalMessage">
      I LOVE YOU, ANNU 💖💍
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const loveLetter = document.getElementById("loveLetter");
    const finalMessage = document.getElementById("finalMessage");
    const card = document.getElementById("card");
    const valentineText = document.querySelector(".valentine");
    const description = document.querySelector("p");
    const yesBtn = document.querySelector(".yes");

    // 😈 No button runs away
    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", moveButton);

    function moveButton() {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // 💖 Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }

    // 🎉 Confetti / Kisses
    function createConfetti() {
      const confetti = document.createElement("div");
      confetti.className = "confetti";
      confetti.innerHTML = Math.random() > 0.5 ? "🎉" : "😘";
      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 6000);
    }

    setInterval(createHeart, 350);

    // 🌟 Click Yes action
    function yesClick() {
      loveLetter.style.display = "block";
      card.style.background = "rgba(255,240,245,0.95)";
      document.body.style.background = "linear-gradient(135deg, #ff9a9e, #ffdde1)";

      // Confetti + floating kisses
      for (let i=0;i<50;i++){
        setTimeout(createConfetti, i*50);
      }

      // Show final message after 2 seconds
      setTimeout(() => {
        loveLetter.style.display = "none";   // hide letter
        valentineText.style.display = "none"; // hide Valentine line
        description.style.display = "none";   // hide description
        yesBtn.style.display = "none";        // hide Yes button
        noBtn.style.display = "none";         // hide No button
        finalMessage.style.display = "block"; // show final message
      }, 2500);
    }
  </script>

</body>
</html>
