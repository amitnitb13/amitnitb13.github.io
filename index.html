<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For ANURADHA 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Dancing Script', cursive;
      background: linear-gradient(135deg, #800000, #a52a2a, #b22222);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255,228,235,0.95);
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 0 45px rgba(255,77,109,0.45);
      animation: heartbeat 2s infinite;
      position: relative;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    h1 {
      color: #b33a5c;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p, .valentine, .confirmText {
      font-size: 1.4rem;
      color: #b33a5c;
      margin: 0 0 15px 0;
    }

    .valentine {
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 1s;
    }

    .confirmText {
      font-style: italic;
      margin-top: 20px;
      margin-bottom: 25px;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    button {
      font-size: 1.2rem;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      position: relative;
      z-index: 10;
    }

    button:hover {
      transform: scale(1.1);
      transition: transform 0.2s;
    }

    .yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
    }

    .no {
      background: #eee;
      position: absolute;
      z-index: 20;
      top: 10px;
      right: 10px;
      border-radius: 30px;
      padding: 10px 16px;
      user-select: none;
    }

    .heart {
      position: absolute;
      font-size: 24px;
    }

    .letter, .finalMessage {
      display: none;
      font-size: 1.5rem;
      color: #b33a5c;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .finalMessage {
      font-size: 2rem;
      font-weight: bold;
    }
  </style>
</head>

<body>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_4c8c8a4f61.mp3" type="audio/mpeg">
</audio>

<div class="card" id="card">
  <h1 id="greeting">Hey ANURADHA 💖</h1>

  <p id="description">
    On this Propose Day,<br>
    I just want you to know…<br>
    my heart chose you long ago 🌹
  </p>

  <div class="valentine" id="valentineText">
    Will you be my Valentine? 💘
  </div>

  <button class="yes" id="yesBtn" onclick="yesClick()">Yes, forever 💍</button>
  <button class="no" id="noBtn">No 🙃</button>

  <div class="letter" id="loveLetter">
    You are my favorite thought,<br>
    my happiest smile,<br>
    and my most beautiful dream 💕<br><br>
    I promise to love you — always 😘
  </div>

  <p class="confirmText" id="confirmText" style="display:none;">
    Are you sure you wanna be my Valentine? 💌
  </p>

  <div class="finalMessage" id="finalMessage">
    I LOVE YOU 💖💍
  </div>
</div>

<script>
  let yesCount = 0;

  const greeting = document.getElementById("greeting");
  const description = document.getElementById("description");
  const valentine = document.getElementById("valentineText");
  const loveLetter = document.getElementById("loveLetter");
  const finalMessage = document.getElementById("finalMessage");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const confirmText = document.getElementById("confirmText");

  noBtn.addEventListener("mouseover", moveButton);
  noBtn.addEventListener("touchstart", moveButton);

  function moveButton() {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "-20px";
    heart.style.animation = "floatUp 6s linear";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }

  setInterval(createHeart, 400);

  function yesClick() {
    yesCount++;

    if (yesCount === 1) {
      // Hide initial greeting, description, valentine text
      greeting.style.display = "none";
      description.style.display = "none";
      valentine.style.display = "none";

      // Show love letter and confirm text
      loveLetter.style.display = "block";
      confirmText.style.display = "block";

      // Keep Yes button visible and No button floating
      noBtn.style.display = "block";

    } else if (yesCount === 2) {
      // Hide everything except final message
      loveLetter.style.display = "none";
      confirmText.style.display = "none";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
      finalMessage.style.display = "block";
    }
  }
</script>

</body>
</html>
