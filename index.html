<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For ANURADHA 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Dancing Script', cursive;
      background: linear-gradient(135deg, #800000, #a52a2a, #b22222);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255,228,235,0.95);
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 0 45px rgba(255,77,109,0.45);
      animation: heartbeat 2s infinite;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    h1 {
      color: #b33a5c;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p, .valentine, .confirmText {
      font-size: 1.4rem;
      color: #b33a5c;
      margin: 0 0 15px 0;
    }

    .valentine {
      /* same style as h1 */
      font-family: 'Dancing Script', cursive;
      font-weight: 600;
      font-size: 2rem;
      color: #b33a5c;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 1s;
    }

    .confirmText {
      font-weight: 700;
      font-style: normal;
      font-size: 1.8rem;
      margin-top: 20px;
      margin-bottom: 25px;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Buttons container for row layout */
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 20px;
    }

    button {
      font-size: 1.2rem;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      flex: 1 1 auto;
      min-width: 100px;
      position: relative;
      z-index: 10;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
    }

    .no {
      background: #eee;
      border-radius: 30px;
      padding: 10px 16px;
      user-select: none;
      position: relative; /* no absolute now */
      z-index: 20;
    }

    .heart {
      position: absolute;
      font-size: 24px;
    }

    .letter, .finalMessage {
      display: none;
      font-size: 1.5rem;
      color: #b33a5c;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .finalMessage {
      font-size: 2rem;
      font-weight: bold;
    }
  </style>
</head>

<body>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_4c8c8a4f61.mp3" type="audio/mpeg">
</audio>

<div class="card" id="card">
  <h1 id="greeting">Hey ANURADHA 💖</h1>

  <p id="description">
    On this Propose Day,<br>
    I just want you to know…<br>
    my heart chose you long ago 🌹
  </p>

  <div class="valentine" id="valentineText">
    Will you be my Valentine? 💘
  </div>

  <!-- Buttons row for first page -->
  <div class="btn-row" id="firstBtnRow">
    <button class="yes" id="yesBtn" onclick="yesClick()">Yes, forever 💍</button>
    <button class="no" id="noBtn">No 🙃</button>
  </div>

  <div class="letter" id="loveLetter">
    You are my favorite thought,<br>
    my happiest smile,<br>
    and my most beautiful dream 💕<br><br>
    I promise to love you — always 😘
  </div>

  <p class="confirmText" id="confirmText" style="display:none;">
    Are you sure you wanna be my Valentine? 💌
  </p>

  <!-- Buttons row for second page -->
  <div class="btn-row" id="secondBtnRow" style="display:none;">
    <button class="yes" id="yesBtn2" onclick="yesClick()">Yes, forever 💍</button>
    <button class="no" id="noBtn2">No 🙃</button>
  </div>

  <div class="finalMessage" id="finalMessage">
    I LOVE YOU 💖💍
  </div>
</div>

<script>
  let yesCount = 0;

  const greeting = document.getElementById("greeting");
  const description = document.getElementById("description");
  const valentine = document.getElementById("valentineText");

  const loveLetter = document.getElementById("loveLetter");
  const finalMessage = document.getElementById("finalMessage");

  const firstBtnRow = document.getElementById("firstBtnRow");
  const secondBtnRow = document.getElementById("secondBtnRow");

  const confirmText = document.getElementById("confirmText");

  const noBtn1 = document.getElementById("noBtn");
  const noBtn2 = document.getElementById("noBtn2");

  // Make both no buttons run away
  noBtn1.addEventListener("mouseover", moveButton);
  noBtn1.addEventListener("touchstart", moveButton);

  noBtn2.addEventListener("mouseover", moveButton2);
  noBtn2.addEventListener("touchstart", moveButton2);

  function moveButton() {
    const x = Math.random() * (firstBtnRow.offsetWidth - noBtn1.offsetWidth);
    noBtn1.style.transform = `translateX(${x}px)`;
  }
  function moveButton2() {
    const x = Math.random() * (secondBtnRow.offsetWidth - noBtn2.offsetWidth);
    noBtn2.style.transform = `translateX(${x}px)`;
  }

  function yesClick() {
    yesCount++;

    if (yesCount === 1) {
      // Hide first page texts and buttons
      greeting.style.display = "none";
      description.style.display = "none";
      valentine.style.display = "none";
      firstBtnRow.style.display = "none";

      // Show love letter, confirm text, second buttons row
      loveLetter.style.display = "block";
      confirmText.style.display = "block";
      secondBtnRow.style.display = "flex";
    } else if (yesCount === 2) {
      // Hide everything except final message
      loveLetter.style.display = "none";
      confirmText.style.display = "none";
      secondBtnRow.style.display = "none";
      finalMessage.style.display = "block";
    }
  }
</script>

</body>
</html>
